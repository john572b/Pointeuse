services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      APP_URL: https://pointeuse.boi.lu
    volumes:
      - pointeuse-data:/data
    expose:
      - "3000"

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on:
      - app

volumes:
  pointeuse-data:
  caddy-data:
